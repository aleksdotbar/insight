# One project for the whole deployed-stand test tree.
#
#   tests/lib/   — insight_stand, the shared library (importable package)
#   tests/stand/ — the suite that consumes it (api/, ui/)
#
# Both halves share one dependency set and one lockfile, so the host runner and
# the ui-tests container install byte-identical versions instead of drifting.
#
#   uv sync --project tests                       # create tests/.venv
#   uv run --project tests playwright install chromium
#   uv run --project tests pytest tests/stand     # or: ./dev-compose.sh test-stand test
#
# Everything is pinned and locked (tests/uv.lock). Adding a dependency means
# editing this file and re-running `uv lock --project tests`.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-stand-tests"
version = "0.1.0"
description = "Deployed-stand test suite for Insight: shared library plus API and browser journeys."
# Matches deploy/seed/pyproject.toml, whose manifest and PROFILE renderer this
# suite reads. uv provisions this interpreter everywhere — including inside the
# ui-tests image, whose own system Python is older — so the floor holds in every
# runner rather than being a host-only aspiration.
requires-python = ">=3.13"
dependencies = [
    "pytest>=8",
    # Sync HTTP with a cookie jar — the session transport RealLogin needs.
    "httpx>=0.27",
    # Pinned to the Playwright version baked into the ui-tests base image
    # (deploy/compose/ui-tests.Dockerfile). If these drift, the pip package
    # looks for a browser build the image does not contain.
    "playwright==1.61.0",
    "pytest-playwright==0.8.0",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.16",
]

# The library lives under lib/; the suite under stand/ is collected by pytest
# and is deliberately not packaged.
[tool.setuptools.packages.find]
where = ["lib"]
include = ["insight_stand*"]

[tool.pytest.ini_options]
# `-r s` keeps skips visible: without it a `-q` run prints a bare `s` and no
# reason, which turns a skipped browser journey into an invisible one.
addopts = "-ra --strict-markers --strict-config"
markers = [
    "requires_seed(*names): stand fixtures this test needs, validated against the manifest's fixture catalog at COLLECTION time",
    "requires_ingestion: needs a stand whose manifest declares the 'ingestion' capability; skipped with a reason when it does not",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Same pragmatic strict set as deploy/seed/pyproject.toml.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "ANN",      # flake8-annotations
    "DTZ",      # flake8-datetimez (naive datetime is a bug)
    "N",        # pep8-naming
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",  # Dynamic `Any` is sometimes the right tool
    "E501",    # Long lines handled by `line-length`
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
