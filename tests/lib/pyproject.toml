# Shared library for the deployed-stand test suite (`tests/stand/`).
#
# Installed with `pip install -e tests/lib` (or `uv pip install -e tests/lib`).
# `tests/stand/conftest.py` also puts this directory on `sys.path` so the suite
# runs from a checkout without an install step; the packaging metadata here is
# what makes the CI path and the editable path agree.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-tests-stand-lib"
version = "0.1.0"
description = "Shared library for the Insight deployed-stand test suite (tests/stand)."
# Matches deploy/seed/pyproject.toml's floor, and is recorded in the repo-root
# versions.yaml. Do not lower it: every GitHub workflow currently pins
# python-version "3.12", which is BELOW this floor — reconciling that is
# phase 9's job (see .plans out/suite-skeleton.md), not a reason to drop here.
requires-python = ">=3.13"
dependencies = [
    "pytest>=8",
    # Sync HTTP with a cookie jar — the session transport `RealLogin` needs.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "mypy==2.1.0",
    "ruff==0.15.16",
]

[tool.setuptools.packages.find]
include = ["insight_stand*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Same pragmatic strict set as deploy/seed/pyproject.toml.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "ANN",      # flake8-annotations
    "DTZ",      # flake8-datetimez (naive datetime is a bug)
    "N",        # pep8-naming
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",  # Dynamic `Any` is sometimes the right tool
    "E501",    # Long lines handled by `line-length`
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
