# Package metadata, dependencies, and tool config for the Insight sample-data
# seeder. Lives at the tool root so `ruff check .` and `mypy .` cover both the
# `insight_seed` package and its `tests/`, and `pip install .` builds the
# package (only the package — tests are not shipped).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-seed"
version = "0.1.0"
description = "Insight sample-data seeder for the compose stack and Kubernetes test stands."
# 3.12, not 3.13: this package ships inside the toolbox image
# (tools/toolbox/Dockerfile), which is python:3.12-slim, and the rest of the
# ingestion tree pins the same direction (tests/connectors caps at <3.13). No
# 3.13-only syntax or API is used here, so the floor costs nothing.
requires-python = ">=3.12"
dependencies = [
    "PyMySQL==1.2.0",
    "clickhouse-connect==1.6.0",
    # Unpinned to match src/ingestion/tools/toolbox/Dockerfile. dbt-core pulls
    # in PyYAML, which apply-ch-migrations.sh's profiles.yml generator imports.
    "dbt-clickhouse",
]

[project.optional-dependencies]
dev = [
    # dbt-core 1.12 raised its own cap to pathspec<1.1 (dbt-labs/dbt-core#12385),
    # so a current mypy resolves again. Below 2.0 it would pull pathspec<1.0 and
    # drag dbt-core back to the 1.11 line.
    "mypy>=2,<3",
    # Same pin as the ruff-pre-commit hook in .pre-commit-config.yaml, so a local
    # run and the commit hook cannot reach different verdicts.
    "ruff==0.16.0",
    "types-PyMySQL==1.2.0.20260724",
]

# The entry point every runner uses: `python3 -m insight_seed <step>` from this
# directory, which is also what the container images and the Kubernetes Job run.
# The console script is for an installed copy.
[project.scripts]
insight-seed = "insight_seed.__main__:main"

# One importable package; `tests/` stays out of the distribution.
[tool.setuptools.packages.find]
include = ["insight_seed*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pragmatic strict set: pycodestyle, pyflakes, isort, bugbear, comprehensions,
# pyupgrade, return-style, simplify, type-annotations, datetime-tz, naming.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "ANN",      # flake8-annotations
    "DTZ",      # flake8-datetimez (naive datetime is a bug)
    "N",        # pep8-naming
    "RUF",      # ruff-specific
]
ignore = [
    "ANN401",  # Dynamic `Any` is sometimes the right tool
    "E501",    # Long lines handled by `line-length`
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
# clickhouse-connect doesn't ship full type stubs yet
[[tool.mypy.overrides]]
module = "clickhouse_connect.*"
ignore_missing_imports = true
