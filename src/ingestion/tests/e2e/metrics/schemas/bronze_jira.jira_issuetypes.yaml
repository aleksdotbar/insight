# Reusable JSON schema for bronze_jira.jira_issuetypes (the issue-type lookup
# from GET /rest/api/3/issuetype). Columns mirror the AddFields in
# connectors/task-tracking/jira/connector.yaml (jira_issuetypes stream) that
# jira__task_issuetypes.sql reads to build silver.class_task_issuetypes.
schemas:
  bronze_jira.jira_issuetypes:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: false
    properties:
      unique_key: {type: string}
      source_id: {type: string}
      tenant_id: {type: [string, "null"]}
      # The issue-type id arrives as a JSON string and lands as Nullable(String)
      # — unlike the status dimension, whose ids the connector types as JSON
      # numbers. Declaring `number` here makes the seeder expect Float64 and
      # reject the real column.
      id: {type: [string, "null"]}
      name: {type: string}
      # Original, language-independent type name; what the kind is classified
      # from, so a translated instance classifies like an untranslated one.
      untranslatedName: {type: [string, "null"]}
      subtask: {type: [boolean, "null"]}
      hierarchyLevel: {type: [number, string, "null"]}
      collected_at: {type: [string, "null"]}
      _airbyte_raw_id: {type: string}
      _airbyte_extracted_at: {type: string, format: date-time}
      _airbyte_meta: {type: string}
      _airbyte_generation_id: {type: integer}
