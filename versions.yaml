# Version single source of truth.
#
# One key per component, recording the versions that component pins so a
# reviewer can see every floor in one place instead of reading N build files.
# This file is ADD-ONLY in practice: a change here must be made together with
# the build file it mirrors, and no component may remove or edit another's key.
#
# Consistency rule: the value recorded here and the value in the component's
# own build file must agree. Where they cannot yet, the gap is written down
# rather than papered over — see `tests_stand.notes` below.

# Deployed-stand test suite: tests/lib (shared library) + tests/stand (suite).
# Mirrors tests/lib/pyproject.toml's `requires-python`.
tests_stand:
  python: ">=3.13"
  notes: >-
    Matches deploy/seed/pyproject.toml's floor. Every GitHub Actions workflow
    currently pins python-version "3.12", which is BELOW this floor;
    reconciling that is CI enablement's job, not a reason to lower the suite.
