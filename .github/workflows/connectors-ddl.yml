name: connectors-ddl

# Validates the two contracts no other lane can see, against a ClickHouse built
# from scratch by the real pipeline:
#
#   1. the committed connectors-ddl snapshot still matches what the current
#      connectors + dbt + migrations actually produce;
#   2. every staging contributor still lines up field-for-field with its silver
#      union target (check-field-parity.py).
#
# One empty ClickHouse, then straight into bootstrap-db.sh: real connector
# `discover`, the real destination-clickhouse connector, real dbt, real
# migrations. The committed snapshot is deliberately NOT applied first —
# create-bronze-placeholders.sh issues `CREATE ... IF NOT EXISTS`, so a relation
# the snapshot still carries but the current code no longer produces would
# survive into the fresh dump, hide its own deletion from the diff and break
# convergence. That is the same reason bootstrap-db.sh sets
# BOOTSTRAP_SKIP_SNAPSHOT=1 during generation.
#
# Runs on PRs against main and on every commit that lands on main. The push run
# is not redundant: a PR is validated against its own merge-base, so two PRs that
# are each green apart — one adding a gold table, one regenerating the snapshot —
# can still leave main drifted, and only a run on the merged tree sees that.
#
# PRs are gated on the branch living in this repository: the job runs PR code and
# needs the HubSpot / Salesforce credentials whose CDK `discover` calls a live
# API, and secrets are not available to fork PRs. The trigger is `pull_request`,
# never `pull_request_target` — that would run fork code with access to those
# secrets. Pushes always carry secrets, so they need no such guard.
#
# The job validates; it never commits. A stale snapshot is the author's to
# regenerate (see the failure message).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR push is free; superseding a main commit is not — that run is
  # the only signal that this particular merged tree converges.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  connectors-ddl:
    name: connectors-ddl snapshot + field parity
    # Fork PR: no secrets, so `discover` for hubspot/salesforce cannot run. Skip
    # up front instead of dying 20 minutes into the bootstrap. A push to main is
    # always in-repo, so it has no head repository to compare.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOOTSTRAP_DIR: src/ingestion/scripts/bootstrap-db
      CLICKHOUSE_CONTAINER: connectors-ddl-clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_PROTOCOL: http
      CLICKHOUSE_USER: insight
      CLICKHOUSE_PASSWORD: insight
      CLICKHOUSE_DATABASE: insight
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-python@v6
        with:
          # run-dbt.sh builds its venv from python3.12/3.11 — dbt-core 1.10 does
          # not run on newer pythons.
          python-version: "3.12"

      - name: Load image pins + check tooling
        run: |
          set -euo pipefail
          # pins.env is plain KEY=VALUE, so it doubles as a $GITHUB_ENV fragment:
          # every image/version stays pinned in exactly one committed place.
          cat "${BOOTSTRAP_DIR}/pins.env" >> "$GITHUB_ENV"
          # seed-connectors.sh needs mikefarah yq v4 and jq; both ship in the
          # runner image. Fail here with a clear message rather than inside a
          # connector loop if that ever changes.
          yq --version
          jq --version

      - name: Require connector credentials
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_INSTANCE_URL: ${{ secrets.SALESFORCE_INSTANCE_URL }}
        run: |
          set -euo pipefail
          # HubSpot and Salesforce build their catalogue from a live API, so their
          # `discover` cannot run on fake values. Without them seed-connectors.sh
          # skips both connectors, their bronze never lands, and dbt dies — 20
          # minutes later, with a confusing error. Fail in 5 seconds instead,
          # naming exactly what is missing.
          missing=()
          for var in HUBSPOT_ACCESS_TOKEN SALESFORCE_CLIENT_ID SALESFORCE_CLIENT_SECRET SALESFORCE_INSTANCE_URL; do
            [[ -n "${!var:-}" ]] || missing+=("$var")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Missing repository secrets::${missing[*]} — hubspot/salesforce discover calls a live API and cannot run on fake values. Add them as repository secrets, or narrow connectors-config.yaml."
            exit 1
          fi

      - name: Start an empty ClickHouse
        run: |
          set -euo pipefail
          # The bridge gateway is the runner host as seen from inside a container:
          # the same address works for dbt (on the host) and for the connector
          # containers create-connector-tables.sh starts, which reach the
          # published port. `host.docker.internal` does not resolve on Linux.
          host="$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')"
          echo "CLICKHOUSE_HOST=${host}" >> "$GITHUB_ENV"
          echo "CLICKHOUSE_URL=http://${host}:8123" >> "$GITHUB_ENV"
          .github/workflows/scripts/start-clickhouse.sh "${CLICKHOUSE_CONTAINER}"

      - name: Bootstrap from connectors + dbt + migrations
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_INSTANCE_URL: ${{ secrets.SALESFORCE_INSTANCE_URL }}
        run: |
          set -euo pipefail
          "${BOOTSTRAP_DIR}/bootstrap-db.sh" "${BOOTSTRAP_DIR}/connectors-config.yaml"

      - name: Re-dump the snapshot and fail on drift
        run: |
          set -euo pipefail
          "${BOOTSTRAP_DIR}/dump-ddl.sh"
          # --intent-to-add so a brand-new connector's .sql file (untracked, and
          # therefore invisible to a plain `git diff`) counts as drift too.
          git add --intent-to-add --all -- src/ingestion/scripts/connectors-ddl
          git diff -- src/ingestion/scripts/connectors-ddl > "$RUNNER_TEMP/connectors-ddl.diff"
          if [[ -s "$RUNNER_TEMP/connectors-ddl.diff" ]]; then
            echo "::error title=connectors-ddl snapshot is stale::Regenerate it: ${BOOTSTRAP_DIR}/bootstrap-db.sh ${BOOTSTRAP_DIR}/connectors-config.yaml && ${BOOTSTRAP_DIR}/dump-ddl.sh — then commit the result. Full diff in the connectors-ddl-drift artifact."
            git diff --stat -- src/ingestion/scripts/connectors-ddl
            head -n 200 "$RUNNER_TEMP/connectors-ddl.diff"
            exit 1
          fi
          echo "snapshot converges: re-dump is byte-identical"

      - name: Upload the drift diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connectors-ddl-drift
          path: ${{ runner.temp }}/connectors-ddl.diff
          if-no-files-found: ignore

      - name: Field parity
        run: |
          set -euo pipefail
          # Every model in the manifest must have a relation (bootstrap-db just
          # built all of them, so a gap means something failed quietly), and any
          # column-set, order or type divergence fails the job. The one benign
          # shape — the target widened this contributor's T to Nullable(T) because
          # another branch is nullable — is printed as WARN and does not fail.
          # manifest.json comes from the dbt run inside bootstrap-db.
          if ! "${BOOTSTRAP_DIR}/check-field-parity.py" --no-env-file; then
            echo "::error title=Field parity::A staging contributor does not line up with its silver union target. ClickHouse unions branches BY POSITION and widens types silently, so this is a data-correctness gate, not style."
            exit 1
          fi

      - name: ClickHouse logs
        if: failure()
        run: docker logs --tail 200 "${CLICKHOUSE_CONTAINER}" 2>&1 || true
