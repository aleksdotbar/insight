name: connectors-ddl

# Validates the two contracts no other lane can see, against a real ClickHouse
# built from scratch:
#
#   1. the committed connectors-ddl snapshot still applies to an empty cluster
#      and still matches what the current connectors + dbt actually produce;
#   2. every staging contributor still lines up field-for-field with its silver
#      union target (check-field-parity.py).
#
# Two phases, each on its OWN throwaway ClickHouse:
#
#   Phase 1 — apply the committed snapshot to an empty cluster, exactly as a
#     fresh deploy does via create-bronze-placeholders.sh, and audit whatever the
#     snapshot carries.
#   Phase 2 — a SECOND empty cluster: run the full bootstrap (real connector
#     `discover`, the real destination-clickhouse connector, real dbt, real
#     migrations), re-dump the snapshot and fail on any diff, then audit field
#     parity strictly.
#
# Phase 2 must NOT inherit phase 1's cluster. create-bronze-placeholders.sh
# applies `CREATE ... IF NOT EXISTS`, so a relation the committed snapshot still
# carries but the current code no longer produces would survive into the fresh
# dump, hide its own deletion from the diff, and break convergence — the same
# reason bootstrap-db.sh sets BOOTSTRAP_SKIP_SNAPSHOT=1 during generation.
#
# PR-only, and only for PRs whose branch lives in this repository: the job runs
# PR code and needs the HubSpot / Salesforce credentials whose CDK `discover`
# calls a live API, and secrets are not available to fork PRs. The trigger is
# `pull_request`, never `pull_request_target` — that would run fork code with
# access to those secrets.
#
# The job validates; it never commits. A stale snapshot is the author's to
# regenerate (see the failure message).

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connectors-ddl:
    name: connectors-ddl snapshot + field parity
    # Fork PR: no secrets, so `discover` for hubspot/salesforce cannot run. Skip
    # up front instead of dying 20 minutes into the bootstrap.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOOTSTRAP_DIR: src/ingestion/scripts/bootstrap-db
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_PROTOCOL: http
      CLICKHOUSE_USER: insight
      CLICKHOUSE_PASSWORD: insight
      CLICKHOUSE_DATABASE: insight
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-python@v6
        with:
          # run-dbt.sh builds its venv from python3.12/3.11 — dbt-core 1.10 does
          # not run on newer pythons.
          python-version: "3.12"

      - name: Load image pins + check tooling
        run: |
          set -euo pipefail
          # pins.env is plain KEY=VALUE, so it doubles as a $GITHUB_ENV fragment:
          # every image/version stays pinned in exactly one committed place.
          cat "${BOOTSTRAP_DIR}/pins.env" >> "$GITHUB_ENV"
          # seed-connectors.sh needs mikefarah yq v4 and jq; both ship in the
          # runner image. Fail here with a clear message rather than inside a
          # connector loop if that ever changes.
          yq --version
          jq --version

      - name: Require connector credentials
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_INSTANCE_URL: ${{ secrets.SALESFORCE_INSTANCE_URL }}
        run: |
          set -euo pipefail
          # HubSpot and Salesforce build their catalogue from a live API, so their
          # `discover` cannot run on fake values. Without them seed-connectors.sh
          # skips both connectors, their bronze never lands, and phase 2 dies in
          # dbt — 20 minutes later, with a confusing error. Fail in 5 seconds
          # instead, naming exactly what is missing.
          missing=()
          for var in HUBSPOT_ACCESS_TOKEN SALESFORCE_CLIENT_ID SALESFORCE_CLIENT_SECRET SALESFORCE_INSTANCE_URL; do
            [[ -n "${!var:-}" ]] || missing+=("$var")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Missing repository secrets::${missing[*]} — hubspot/salesforce discover calls a live API and cannot run on fake values. Add them as repository secrets, or narrow connectors-config.yaml."
            exit 1
          fi

      - name: Start ClickHouse (phase 1)
        run: |
          set -euo pipefail
          # The bridge gateway is the runner host as seen from inside a container:
          # the same address works for dbt (on the host) and for the connector
          # containers create-connector-tables.sh starts, which reach the
          # published port. `host.docker.internal` does not resolve on Linux.
          host="$(docker network inspect bridge -f '{{ (index .IPAM.Config 0).Gateway }}')"
          echo "CLICKHOUSE_HOST=${host}" >> "$GITHUB_ENV"
          echo "CLICKHOUSE_URL=http://${host}:8123" >> "$GITHUB_ENV"
          .github/workflows/scripts/start-clickhouse.sh ddl-phase1

      - name: Build the dbt manifest
        run: |
          set -euo pipefail
          # check-field-parity.py needs manifest.json for the staging -> silver tag
          # mapping, and phase 1 audits BEFORE anything is built. A selector that
          # matches nothing makes dbt parse the project, write the manifest and
          # build zero models (exit 0) — and warms the pinned venv that phase 2
          # reuses. run-dbt.sh always runs `dbt run`, hence the empty selection
          # rather than `dbt parse`.
          "${BOOTSTRAP_DIR}/run-dbt.sh" --select __manifest_only_no_such_model__

      - name: Apply the committed snapshot
        run: bash src/ingestion/scripts/create-bronze-placeholders.sh

      - name: Field parity over the snapshot
        run: |
          set -euo pipefail
          # --allow-missing-relations: the snapshot carries only the
          # gold-referenced staging tables by design (dump-ddl.sh), so demanding a
          # relation per model would fail every run for the wrong reason. Absent
          # relations are printed, not counted. Everything else stays a hard
          # failure: this proves the snapshot applies to an empty cluster and that
          # what it does carry is internally consistent.
          if ! "${BOOTSTRAP_DIR}/check-field-parity.py" --no-env-file --allow-missing-relations; then
            echo "::error title=Field parity (snapshot)::The committed connectors-ddl snapshot is not field-consistent. Fix the staging/silver models, regenerate the snapshot, and commit it."
            exit 1
          fi

      - name: Start ClickHouse (phase 2 — fresh cluster)
        run: |
          set -euo pipefail
          # A brand-new container, NOT the phase 1 one: see the header comment on
          # why generation must never see the previous snapshot.
          docker rm -f ddl-phase1
          .github/workflows/scripts/start-clickhouse.sh ddl-phase2

      - name: Bootstrap from connectors + dbt + migrations
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          SALESFORCE_CLIENT_ID: ${{ secrets.SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_INSTANCE_URL: ${{ secrets.SALESFORCE_INSTANCE_URL }}
        run: "${BOOTSTRAP_DIR}/bootstrap-db.sh ${BOOTSTRAP_DIR}/connectors-config.yaml"

      - name: Re-dump the snapshot and fail on drift
        run: |
          set -euo pipefail
          "${BOOTSTRAP_DIR}/dump-ddl.sh"
          # --intent-to-add so a brand-new connector's .sql file (untracked, and
          # therefore invisible to a plain `git diff`) counts as drift too.
          git add --intent-to-add --all -- src/ingestion/scripts/connectors-ddl
          git diff -- src/ingestion/scripts/connectors-ddl > "$RUNNER_TEMP/connectors-ddl.diff"
          if [[ -s "$RUNNER_TEMP/connectors-ddl.diff" ]]; then
            echo "::error title=connectors-ddl snapshot is stale::Regenerate it: ${BOOTSTRAP_DIR}/bootstrap-db.sh ${BOOTSTRAP_DIR}/connectors-config.yaml && ${BOOTSTRAP_DIR}/dump-ddl.sh — then commit the result. Full diff in the connectors-ddl-drift artifact."
            git diff --stat -- src/ingestion/scripts/connectors-ddl
            head -n 200 "$RUNNER_TEMP/connectors-ddl.diff"
            exit 1
          fi
          echo "snapshot converges: re-dump is byte-identical"

      - name: Upload the drift diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connectors-ddl-drift
          path: ${{ runner.temp }}/connectors-ddl.diff
          if-no-files-found: ignore

      - name: Field parity over the rebuilt warehouse
        run: |
          set -euo pipefail
          # Strict: every model in the manifest must have a relation, and any
          # column-set, order or type divergence — Nullable(T) vs T included — is
          # a failure.
          if ! "${BOOTSTRAP_DIR}/check-field-parity.py" --no-env-file; then
            echo "::error title=Field parity (rebuilt)::A staging contributor does not line up with its silver union target. ClickHouse unions branches BY POSITION and widens types silently, so this is a data-correctness gate, not style."
            exit 1
          fi

      - name: ClickHouse logs
        if: failure()
        run: docker logs --tail 200 ddl-phase2 2>&1 || docker logs --tail 200 ddl-phase1 2>&1 || true
