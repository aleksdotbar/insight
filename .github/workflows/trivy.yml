name: Trivy SCA

# Software-composition analysis over the repository. Two passes:
#
#   critical — CRITICAL only, and the one pass that also runs the secret scanner. Report-only
#            like everything else here (`--exit-code 0`); kept separate because its output goes
#            to the log alone, never to a SARIF upload. Baseline: 0 secrets, 0 CRITICAL
#            misconfigurations, 9 CRITICAL vulnerabilities once locks resolve.
#   report — every severity, never blocks. Findings land in "Security -> Code scanning" plus a
#            job-summary table. It resolves what the repository cannot express on its own before
#            scanning — see the two paragraphs below.
#
# Lock files: `trivy fs` resolves dependency versions from them, and this repository commits
# exactly one — Cargo.lock. The eleven pyproject.toml projects have none, so Python was
# previously invisible here. The report job generates them in the workspace before scanning
# (`uv lock`) and throws them away with the runner. Nothing is committed and no build contract
# changes; the scan simply resolves what it needs. This also reaches the projects no image
# contains — tests, scripts, deploy/seed. .NET is not resolved; the step explains why.
#
# Helm charts: seven of the nine in this repository cannot be scanned as raw templates because
# they `required` values at render time, so Trivy skipped them and reported only the two that
# happen to render. The report job now renders all of them with throwaway values and scans the
# output, which takes the misconfiguration count from 21 to 124. Rendered YAML is uploaded under
# its own `trivy-helm` category so its synthetic paths never mix with real repository files.
#
# The report pass drops the secret scanner (`--scanners vuln,misconfig`): Code Scanning
# alerts on a public repository are world-readable and Trivy quotes the surrounding match.
# Secrets stay in the `critical` pass, whose output reaches the log only, and TruffleHog owns
# the domain anyway (trufflehog.yml).
#
# The umbrella chart in charts/insight stays unscanned: it needs `helm dependency build` to pull
# subcharts, which the rendered per-service charts already cover template-for-template.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly, 03:41 UTC — after the TruffleHog sweep (03:13) and Semgrep baseline (03:27).
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  gate:
    name: critical (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Trivy fs scan — CRITICAL only (report-only)
        # `--ignore-unfixed` keeps the output actionable: a CRITICAL with no released fix cannot
        # be resolved by the PR author. Waivers go in `.trivyignore` at the repo root,
        # date-scoped — they matter again the moment this pass becomes blocking:
        #   CVE-2026-12345   exp:2026-12-31   # tracked in #NNNN, fix queued
        #
        # `-w /src` is load-bearing for that: Trivy resolves the default ignore file relative
        # to the working directory, so without it a repo-root `.trivyignore` is read from the
        # image's own cwd and silently ignored. `--ignorefile` is not used instead because
        # Trivy exits FATAL when the named file does not exist, which would break every run
        # until someone adds a waiver.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -w /src \
            "$TRIVY_IMAGE" fs \
              --scanners vuln,secret,misconfig \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --no-progress \
              /src

  report:
    name: report (all severities + charts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Resolve Python dependencies
        # Trivy needs a lock file to know which versions are in play, and the eleven
        # pyproject.toml projects commit none. These are generated into the workspace and die with
        # the runner — nothing is committed and no build contract changes. Measured: one
        # connector's generated uv.lock carries 9 findings including a CRITICAL, and across all
        # eleven the repository goes from 0 vulnerabilities to 102.
        #
        # .NET is deliberately absent. `dotnet restore --use-lock-file` needs an 851 MB SDK image
        # plus ~30s and reported 0 findings across all five .csproj projects; whatever actually
        # ships is covered by the insight-identity image scan. Worth reinstating only if a NuGet
        # finding ever shows up there.
        #
        # Best-effort by design: a registry hiccup during resolution must cost coverage, not the
        # whole report. Each `uv lock` is guarded individually so one unresolvable project does
        # not take the other ten with it.
        continue-on-error: true
        env:
          UV_IMAGE: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
        run: |
          set -uo pipefail
          git ls-files '**/pyproject.toml' | while read -r manifest; do
            project="$(dirname "$manifest")"
            docker run --rm \
              -v "${{ github.workspace }}:/repo" \
              -w "/repo/${project}" \
              "$UV_IMAGE" uv lock \
              || echo "uv lock failed — skipped ${project}"
          done
          echo "Lock files now present:"
          git ls-files --others --exclude-standard | grep -E 'uv\.lock' | sed 's/^/  /' || echo "  none"

      - name: Trivy fs scan — all severities
        # One scan, two formats: JSON feeds the summary below, and `trivy convert` derives the
        # SARIF from that same JSON instead of rescanning. `-w /src` for the ignore-file reason
        # documented on the `critical` pass.
        #
        # CRITICAL is in the severity list even though the `critical` pass covers it: that pass
        # only prints a table, so without this a CRITICAL would never appear as an alert.
        # `--include-dev-deps` because a compromised build-time dependency executes during the
        # build; excluding them understates the supply-chain surface.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v /tmp/trivy-cache:/root/.cache \
            -w /src \
            "$TRIVY_IMAGE" fs \
              --scanners vuln,misconfig \
              --severity CRITICAL,HIGH,MEDIUM,LOW \
              --include-dev-deps \
              --exit-code 0 \
              --no-progress \
              --format json --output /src/trivy-fs.json \
              /src
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            "$TRIVY_IMAGE" convert \
              --format sarif --output /src/trivy-fs.sarif \
              /src/trivy-fs.json

      - name: Summarize findings in the job summary
        if: always()
        # Null-guarded append (repo convention, cf. semgrep.yml). Vulnerabilities are grouped
        # by package because that is the unit of remediation; misconfigurations are grouped by
        # rule because one rule usually means the same fix in several files.
        run: |
          [ -f trivy-fs.json ] || exit 0
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          CS_BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/security/code-scanning"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            CS_URL="${CS_BASE}?query=is%3Aopen+pr%3A${GITHUB_REF_NAME%/merge}"
          else
            CS_URL="${CS_BASE}?query=is%3Aopen+branch%3A${GITHUB_REF_NAME}"
          fi
          python3 - trivy-fs.json "$GITHUB_STEP_SUMMARY" "$CS_URL" <<'PY'
          import json, sys, collections
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          out = open(sys.argv[2], "a", encoding="utf-8")
          cs_url = sys.argv[3]
          w = out.write
          vulns, miscfg = [], []
          for r in d.get("Results") or []:
              vulns += r.get("Vulnerabilities") or []
              miscfg += [(r.get("Target"), m) for m in (r.get("Misconfigurations") or [])]
          w("## Trivy SCA — repository (report-only)\n\n")
          w(f"**{len(vulns)}** vulnerabilit(ies) + **{len(miscfg)}** misconfiguration(s), every "
            f"severity, including development dependencies and the Python lock files "
            f"resolved for this run. Image layers are covered by `Trivy Images`. "
            f"Full details in [Security -> Code scanning]({cs_url}).\n\n")
          rank = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3}
          if vulns:
              bundles = collections.defaultdict(list)
              for v in vulns:
                  bundles[(v["PkgName"], v.get("InstalledVersion", "?"))].append(v)
              w("| Package | Max | CVEs | Fixed in |\n|---|---|---:|---|\n")
              for (pkg, ver), items in sorted(
                      bundles.items(), key=lambda kv: (min(rank.get(i["Severity"], 4) for i in kv[1]), kv[0])):
                  worst = min(items, key=lambda i: rank.get(i["Severity"], 4))["Severity"]
                  fixes = sorted({i.get("FixedVersion") or "-" for i in items})
                  w(f"| `{pkg}@{ver}` | {worst} | {len(items)} | {', '.join(fixes)} |\n")
              w("\n")
          if miscfg:
              by_rule = collections.defaultdict(list)
              for target, m in miscfg:
                  by_rule[(m["Severity"], m["ID"], m.get("Title", ""))].append(target)
              w("| Severity | Rule | Files | Title |\n|---|---|---:|---|\n")
              for (sev, rid, title), targets in sorted(by_rule.items(), key=lambda kv: (rank.get(kv[0][0], 4), kv[0][1])):
                  w(f"| {sev} | `{rid}` | {len(targets)} | {title} |\n")
              w("\n<details><summary>Misconfigurations by file</summary>\n\n| Severity | Rule | Target |\n|---|---|---|\n")
              for target, m in sorted(miscfg, key=lambda tm: (rank.get(tm[1]["Severity"], 4), tm[0])):
                  w(f"| {m['Severity']} | `{m['ID']}` | `{target}` |\n")
              w("\n</details>\n")
          PY

      - name: Upload SARIF to GitHub Code Scanning
        # Skip on fork PRs: read-only token cannot upload, which would red-X this report-only job.
        # The hashFiles guard keeps a failed scan from producing a second, misleading error that
        # points at Code Scanning rather than at the scan that actually broke.
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@fb0994ef1c058010acf1efccff928b0a83b1ed54 # v4.32.6
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # ─── Helm charts, rendered ─────────────────────────────────────────────
      # Runs after the repository scan so the rendered output is not swept into it. Seven of the
      # nine charts `required` values at render time, which is why Trivy skipped them as raw
      # templates. The values below are throwaway and only need to satisfy those guards; every
      # key is set unconditionally because an unused key is harmless.
      - name: Render Helm charts
        continue-on-error: true
        env:
          HELM_IMAGE: alpine/helm:3.16.3@sha256:ed9dfc49d43d034df3f9880eb777caf0183e5156508672478b80412c63f3db4f
        run: |
          set -uo pipefail
          mkdir -p .helm-rendered
          for chart in src/backend/services/*/helm src/frontend/helm; do
            [ -f "$chart/Chart.yaml" ] || continue
            name="$(printf '%s' "$chart" | sed -E 's#^src/(backend/services|)/?##; s#/helm$##; s#/#-#g')"
            docker run --rm \
              -v "${{ github.workspace }}:/repo" \
              -w /repo \
              "$HELM_IMAGE" template scan "$chart" \
                --set existingSecret=dummy \
                --set signingKeysSecret=dummy \
                --set tlsDiscovery.issuerRef.name=dummy \
                --set issuer=http://idp.invalid \
                --set hostname=http://kc.invalid \
                --set image.repository=ghcr.io/example/image \
                --set image.tag=scan \
                --set oidc.scopes=openid \
              > ".helm-rendered/${name}.yaml" \
              || { echo "render failed — skipped ${chart}"; rm -f ".helm-rendered/${name}.yaml"; }
          done
          echo "Rendered:"
          find .helm-rendered -name '*.yaml' -exec basename {} ';' | sed 's/^/  /'

      - name: Trivy scan — rendered charts
        continue-on-error: true
        run: |
          set -euo pipefail
          find .helm-rendered -name '*.yaml' -print -quit 2>/dev/null | grep -q . \
            || { echo "nothing rendered — skipping"; exit 0; }
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v /tmp/trivy-cache:/root/.cache \
            -w /src \
            "$TRIVY_IMAGE" fs \
              --scanners misconfig \
              --severity CRITICAL,HIGH,MEDIUM,LOW \
              --exit-code 0 \
              --no-progress \
              --format json --output /src/trivy-helm.json \
              /src/.helm-rendered
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            "$TRIVY_IMAGE" convert \
              --format sarif --output /src/trivy-helm.sarif \
              /src/trivy-helm.json

      - name: Summarize rendered-chart findings
        if: always()
        run: |
          [ -f trivy-helm.json ] || exit 0
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          python3 - trivy-helm.json "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys, collections, os
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          out = open(sys.argv[2], "a", encoding="utf-8")
          w = out.write
          rows = [(os.path.basename(r.get("Target", "?")), m)
                  for r in (d.get("Results") or []) for m in (r.get("Misconfigurations") or [])]
          w("\n## Trivy — Helm charts, rendered (report-only)\n\n")
          if not rows:
              w("No misconfigurations in the rendered charts.\n")
              sys.exit(0)
          rank = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3}
          sev = collections.Counter(m["Severity"] for _, m in rows)
          w(f"**{len(rows)}** misconfiguration(s) across "
            f"{len({t for t, _ in rows})} chart(s) — "
            + ", ".join(f"{sev[s]} {s}" for s in ("CRITICAL", "HIGH", "MEDIUM", "LOW") if sev.get(s))
            + ". These charts are invisible to a raw-template scan because they require values at "
              "render time.\n\n")
          w("| Chart | Findings | Worst |\n|---|---:|---|\n")
          per = collections.defaultdict(list)
          for target, m in rows:
              per[target].append(m)
          for target, items in sorted(per.items(), key=lambda kv: (min(rank.get(m["Severity"], 4) for m in kv[1]), kv[0])):
              worst = min(items, key=lambda m: rank.get(m["Severity"], 4))["Severity"]
              w(f"| `{target}` | {len(items)} | {worst} |\n")
          w("\n<details><summary>By rule</summary>\n\n| Severity | Rule | Charts | Title |\n|---|---|---:|---|\n")
          by_rule = collections.defaultdict(set)
          titles = {}
          for target, m in rows:
              by_rule[(m["Severity"], m["ID"])].add(target)
              titles[(m["Severity"], m["ID"])] = m.get("Title", "")
          for (s, rid), charts in sorted(by_rule.items(), key=lambda kv: (rank.get(kv[0][0], 4), kv[0][1])):
              w(f"| {s} | `{rid}` | {len(charts)} | {titles[(s, rid)]} |\n")
          w("\n</details>\n")
          out.close()
          PY

      - name: Upload rendered-chart SARIF
        # Its own category: the paths are synthetic (`.helm-rendered/*.yaml`), so keeping them out
        # of `trivy-fs` prevents them from being confused with files that exist in the tree.
        if: ${{ always() && hashFiles('trivy-helm.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@fb0994ef1c058010acf1efccff928b0a83b1ed54 # v4.32.6
        with:
          sarif_file: trivy-helm.sarif
          category: trivy-helm
